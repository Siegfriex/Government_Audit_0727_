name: data-integrity

on:
  push:
    branches: [main, 'stage/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data.txt
      - name: Install validation dependencies
        run: python -m pip install pandas==3.0.3 pyarrow==24.0.0
      - name: Validate public data and canonical runtime
        run: |
          python scripts/validate_data_integrity.py --stage all
          python scripts/verify_frontend_release.py
